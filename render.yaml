# render.yaml - Render 自动化部署配置
# 文档: https://render.com/docs/yaml

services:
  - type: web
    name: huiyingerp
    runtime: node
    region: singapore
    plan: free

    # 从 GitHub 自动部署
    github:
      repo: DYxiaoyu/huiyingerp
      branch: master
      autoDeploy: true

    # 构建配置
    buildCommand: npm ci && npm run build:prod
    healthCheckPath: /api

    # 启动命令
    startCommand: node dist/server/main.js

    # 环境变量（在 Render Dashboard 也可以手动填，这里填默认值）
    envVars:
      - key: NODE_ENV
        value: production
      - key: SERVER_HOST
        value: 0.0.0.0
      - key: SERVER_PORT
        value: 10000
      - key: DATABASE_URL
        sync: false   # ← 需要你在 Render Dashboard 填入，格式见下方
      - key: LOG_DIR
        value: ./logs
      - key: LOG_REQUEST_BODY
        value: "true"
      - key: LOG_RESPONSE_BODY
        value: "true"
