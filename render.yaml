# render.yaml - Render 自动化部署配置
databases:
  - name: customer-crm-db
    databaseName: customer_crm
    user: customer_crm
    plan: free

services:
  - type: web
    name: customer-crm-web
    runtime: node
    region: singapore
    plan: free

    github:
      repo: DYxiaoyu/huiyingerp
      branch: main
      autoDeploy: true

    buildCommand: npm ci && npm run build:prod
    healthCheckPath: /api
    startCommand: node dist/server/main.js

    envVars:
      - key: NODE_ENV
        value: production
      - key: SERVER_HOST
        value: 0.0.0.0
      - key: SERVER_PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: customer-crm-db
          property: connectionString
      - key: LOG_DIR
        value: ./logs
      - key: LOG_REQUEST_BODY
        value: "true"
      - key: LOG_RESPONSE_BODY
        value: "true"
