# render.yaml - Render 自动化部署配置
# 文档: https://render.com/docs/yaml

services:
  - type: web
    name: huiyingerp
    runtime: node
    region: singapore
    plan: free

    # 从 GitHub 自动部署
    github:
      repo: DYxiaoyu/huiyingerp
      branch: main
      autoDeploy: true

    # 构建配置
    buildCommand: npm ci && npm run build:prod
    healthCheckPath: /api

    # 启动命令
    startCommand: node dist/server/main.js

    # 环境变量
    envVars:
      - key: NODE_ENV
        value: production
      - key: SERVER_HOST
        value: 0.0.0.0
      - key: SERVER_PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: dpg-dagft1bl550s73bha6v0-a
          property: connectionString
      - key: LOG_DIR
        value: ./logs
      - key: LOG_REQUEST_BODY
        value: "true"
      - key: LOG_RESPONSE_BODY
        value: "true"
